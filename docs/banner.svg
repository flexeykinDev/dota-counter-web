<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="The Counter Web: Dota 2 counter-picks and the item that shuts each hero down, by flexeykinDEV">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15171c"/>
      <stop offset="0.55" stop-color="#1b1d24"/>
      <stop offset="1" stop-color="#241a16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5c46e"/>
      <stop offset="0.5" stop-color="#f0a04b"/>
      <stop offset="1" stop-color="#d8552f"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0a04b"/>
      <stop offset="1" stop-color="#d8552f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.83" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d8552f" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#d8552f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#4a3222"/>
      <stop offset="1" stop-color="#1c1f27"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5aa9e6"/></marker>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ef5b52"/></marker>
    <clipPath id="round"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <style>
    .flow { stroke-dasharray: 8 6; animation: flow 0.9s linear infinite; }
    .quiet { stroke-dasharray: 2 5; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -14; } }
    @keyframes pulse { 0% { opacity: 0.8; transform: scale(1); } 100% { opacity: 0; transform: scale(1.8); } }
    @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
    <rect x="0" y="0" width="8" height="300" fill="url(#accentV)"/>
  </g>

  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="70" y="92" fill="#8d9099" font-size="19" letter-spacing="6">DOTA 2 COUNTER-PICK GRAPH</text>
    <text x="66" y="168" fill="#f4f5f7" font-size="66" font-weight="700" letter-spacing="2">THE COUNTER WEB</text>
    <text x="70" y="214" fill="url(#accent)" font-size="25" font-weight="600">Who beats who, and the item that shuts them down</text>
    <text x="70" y="260" fill="#6f727b" font-size="18">by flexeykinDEV  /  127 heroes  /  732 counters  /  patch 7.41</text>
  </g>

  <!-- mini counter graph: arrows point from the counter to the hero it beats -->
  <g transform="translate(1010 150)">
    <g fill="none" stroke-width="1.2" opacity="0.35">
      <path d="M-128 -86 L-70 -104" stroke="#5aa9e6" class="quiet"/>
      <path d="M130 70 L96 112" stroke="#ef5b52" class="quiet"/>
      <path d="M-150 40 L-128 -86" stroke="#ef5b52" class="quiet"/>
      <path d="M70 -110 L130 -40" stroke="#5aa9e6" class="quiet"/>
    </g>

    <path d="M-128 -86 L-40 -26" fill="none" stroke="#5aa9e6" stroke-width="2.2" marker-end="url(#arrS)" class="flow"/>
    <path d="M130 70 L44 26" fill="none" stroke="#ef5b52" stroke-width="2.2" marker-end="url(#arrC)" class="flow"/>
    <path d="M-150 40 L-48 14" fill="none" stroke="#5aa9e6" stroke-width="2.2" marker-end="url(#arrS)" class="flow"/>
    <path d="M70 -110 L22 -44" fill="none" stroke="#ef5b52" stroke-width="2.2" marker-end="url(#arrC)" class="flow"/>
    <path d="M-34 36 L-80 112" fill="none" stroke="#f0a04b" stroke-width="1.4" stroke-opacity="0.55" class="quiet"/>
    <path d="M34 -30 L130 -40" fill="none" stroke="#f0a04b" stroke-width="1.4" stroke-opacity="0.55" class="quiet"/>

    <circle r="38" fill="none" stroke="#f0a04b" stroke-width="2" class="pulse"/>
    <circle r="38" fill="url(#core)" stroke="#f0a04b" stroke-width="3"/>
    <circle r="44" fill="none" stroke="#f0a04b" stroke-opacity="0.2" stroke-width="6"/>
    <path d="M-15 -9 L0 -20 L15 -9 L15 10 L0 21 L-15 10 Z" fill="none" stroke="#f5c46e" stroke-width="2.4" stroke-linejoin="round"/>
    <circle r="5" fill="#f5c46e"/>

    <g stroke-width="2">
      <circle cx="-128" cy="-86" r="15" fill="#1c1f27" stroke="#5aa9e6"/>
      <circle cx="70" cy="-110" r="13" fill="#1c1f27" stroke="#ef5b52"/>
      <circle cx="130" cy="70" r="16" fill="#1c1f27" stroke="#ef5b52"/>
      <circle cx="-150" cy="40" r="12" fill="#1c1f27" stroke="#5aa9e6"/>
      <circle cx="-80" cy="112" r="10" fill="#1c1f27" stroke="#3a404c"/>
      <circle cx="130" cy="-40" r="9" fill="#1c1f27" stroke="#3a404c"/>
      <circle cx="-70" cy="-104" r="7" fill="#1c1f27" stroke="#3a404c"/>
      <circle cx="96" cy="112" r="8" fill="#1c1f27" stroke="#3a404c"/>
    </g>

    <g transform="translate(-26 54)">
      <rect width="52" height="22" rx="6" fill="#0f1014" stroke="#f0a04b" stroke-width="1.4"/>
      <text x="26" y="15.5" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#f5c46e" letter-spacing="1">ITEM</text>
    </g>
  </g>
</svg>
