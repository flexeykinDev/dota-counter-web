name: Refresh matchup data

# Pulls fresh numbers from STRATZ and OpenDota and opens a pull request.
#
# Heads up: a STRATZ token only works from the IP address that first used it, so
# this fails on a GitHub runner with "You cannot use different IP Addresses when
# using the API" unless you supply a token that is bound to the runner, or run
# the job on a self-hosted runner on the machine the token belongs to.
#
# The usual way to refresh is `npm run fetch` on your own machine, then commit
# js/matchups.js. This workflow is here for a self-hosted runner, and it is
# manual-only so a scheduled run can't fail every week.
#
# Needs a repository secret named STRATZ_TOKEN (free token from https://stratz.com/api).
# Nothing is pushed to master: the pull request is there for you to read first,
# because new picks usually need new reasons written by hand.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner to use. Change to your self-hosted label if your token is bound to that machine."
        default: ubuntu-latest
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the token is set
        env:
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
        run: |
          if [ -z "$STRATZ_TOKEN" ]; then
            echo "STRATZ_TOKEN secret is not set. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Fetch matchups
        env:
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
        run: node tools/fetch-matchups.mjs

      - name: Check the data
        run: |
          node tools/counterweb.mjs check > check.txt 2>&1 || true
          cat check.txt

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- js/matchups.js; then
            echo "Numbers are unchanged, nothing to do."
            exit 0
          fi

          branch="data/refresh-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add js/matchups.js
          git commit -m "Refresh matchup data ($(date -u +%Y-%m-%d))"
          git push -u origin "$branch"

          {
            echo "Fresh numbers from STRATZ (Divine and Immortal) and OpenDota (pro games)."
            echo
            echo "\`check\` says:"
            echo
            echo '```'
            tail -40 check.txt
            echo '```'
            echo
            echo "Warnings above mean the picks changed and those counters need a reason."
            echo "See CONTRIBUTING.md: \`plan --json\` for a template, \`apply\` to write it in."
            echo "Do not merge until \`check --strict\` passes."
          } > body.md

          gh pr create --title "Refresh matchup data" --body-file body.md --base master --head "$branch"
